# Recorder configuration. Credentials are NOT stored here: set KALSHI_API_KEY_ID and
# KALSHI_PRIVATE_KEY_PATH in the environment (see deploy/kalshi-recorder.env.example).

env: prod                    # prod | demo (KALSHI_ENV overrides)
data_dir: /var/lib/kalshi/raw  # KALSHI_DATA_DIR overrides
host_label: a

# Which markets to record. A market is subscribed from `lookahead_min` before it opens
# until `linger_min` after it closes; `horizon_hours` skips far-dated expiries.
series:
  # 15-minute up/down markets
  - {ticker: KXBTC15M, lookahead_min: 20, linger_min: 3}
  - {ticker: KXETH15M, lookahead_min: 20, linger_min: 3}
  - {ticker: KXSOL15M, lookahead_min: 20, linger_min: 3}
  - {ticker: KXXRP15M, lookahead_min: 20, linger_min: 3}
  # Hourly/daily ladders (COA 4). The ETH ladder tickers are unverified: check
  # `GET /series` and fix them if the recorder logs empty polls for them.
  - {ticker: KXBTCD, lookahead_min: 1440, horizon_hours: 3, linger_min: 3}
  - {ticker: KXBTC, lookahead_min: 1440, horizon_hours: 3, linger_min: 3}
  - {ticker: KXETHD, lookahead_min: 1440, horizon_hours: 3, linger_min: 3}
  - {ticker: KXETH, lookahead_min: 1440, horizon_hours: 3, linger_min: 3}

market_channels: [orderbook_delta, ticker, trade]
record_lifecycle: true

index:
  ids: [BRTI, ETHUSD_RTI, SOLUSD_RTI, XRPUSD_RTI]
  ids_5hz: [BRTI, ETHUSD_RTI, SOLUSD_RTI, XRPUSD_RTI]
  stale_after_s: 3

max_markets_per_sub: 200     # lowered automatically if Kalshi reports a smaller limit
registry_poll_s: 30
rest_reads_per_s: 5          # stay well under the Basic tier's read limit
flush_interval_s: 1
stats_interval_s: 60

# Free phone alerts: install the ntfy app, pick a hard-to-guess topic, put its URL here.
ntfy_url: null               # e.g. https://ntfy.sh/kalshi-rec-<random>
