[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kalshi-trading"
version = "0.1.0"
description = "Data recorder and trading research for Kalshi 15-minute crypto markets"
requires-python = ">=3.11"
dependencies = [
    "websockets>=13,<16",
    "httpx>=0.27",
    "orjson>=3.10",
    "zstandard>=0.23",
    "pyyaml>=6",
    "cryptography>=43",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
kalshi-recorder = "kalshi_trading.recorder.main:main"
kalshi-retention = "kalshi_trading.storage.retention:main"
kalshi-read-raw = "kalshi_trading.storage.raw_reader:main"

[tool.setuptools.packages.find]
include = ["kalshi_trading*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
